<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ozan Kılıç</title>
  <script>
    (function () {
      try {
        var savedTheme = localStorage.getItem("portfolio-theme");
        if (savedTheme === "light" || savedTheme === "dark") {
          document.documentElement.setAttribute("data-theme", savedTheme);
        }
        var savedLang = localStorage.getItem("portfolio-lang");
        if (savedLang === "tr" || savedLang === "en") {
          document.documentElement.setAttribute("lang", savedLang);
        }
      } catch (error) {}
    })();
  </script>
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <a id="brand-name" class="brand-name" href="#/recent">Ozan Kılıç</a>
        <div class="controls">
          <button id="lang-toggle" class="control-button" type="button" aria-label="Change language">EN</button>
          <button id="theme-toggle" class="control-button" type="button" aria-label="Toggle color theme"></button>
        </div>
      </div>
      <p id="brand-bio" class="brand-bio"></p>
      <nav aria-label="Primary">
        <ul id="nav-list" class="nav-list"></ul>
      </nav>
      <div class="sidebar-divider"></div>
      <div id="social-links" class="social-links"></div>
    </aside>
    <main id="main-content" class="main-content" aria-live="polite"></main>
  </div>
</body>
</html>
